[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egocharm-reproduction"
version = "0.1.0"
description = "Method-level EgoCHARM reproduction on Ego-Exo4D IMU data"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.10,<2",
  "torch>=2.2,<3",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6,<7",
  "matplotlib>=3.7,<4",
  "projectaria-tools>=2.1,<2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "ego-exoD4_dataset/tests"]
pythonpath = ["src"]
