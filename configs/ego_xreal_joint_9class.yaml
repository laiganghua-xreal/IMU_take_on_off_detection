data:
  ego_selection: ego-exoD4_dataset/metadata/egocharm_available_selection.json
  ego_dataset_root: ego-exoD4_dataset
  ego_manifest: artifacts/ego_xreal_joint_9class/cache/ego/manifest.json
  xreal_event_manifest: artifacts/ego_xreal_joint_9class/cache/xreal_events/manifest.json
  xreal_source_roots:
    - /home/xreal/record_data_tools/data/20260818/free_record_only_imu
    - /home/xreal/record_data_tools/data/20260819/free_record_only_imu
  coordinate_frame: cpf-left-up-forward
  sampling_rate_hz: 200
  maximum_gap_seconds: 0.1
  minimum_segment_seconds: 5
  window_seconds: 5
  candidate_step_seconds: 0.025
  evaluation_step_seconds: 5
  maximum_validation_samples_per_class: 500
  normalization: none

augmentation:
  add_bias_noise: true
  accel_bias_range: 0.2
  gyro_bias_range: 0.02
  add_gravity_noise: true
  gravity_noise_theta_range: 5.0
  add_gaussian_noise: true
  accel_noise_sigma: 0.05
  gyro_noise_sigma: 0.005

model:
  class_names:
    - Basketball
    - Soccer
    - Dance
    - Rock Climbing
    - Cooking
    - Bike Repair
    - Music
    - PUT_ON
    - TAKE_OFF
  number_of_classes: 9
  input_channels: 6
  branch_channels: 11
  kernel_size: 2
  dilations: [1, 2, 4, 8, 16]
  number_of_blocks: 3
  dropout: 0.2
  low_level_hidden_size: 32
  high_level_hidden_size: 32

training:
  seed: 42
  number_of_epochs: 30
  samples_per_class_per_epoch: 3600
  batch_size: 32
  number_of_workers: 2
  learning_rate: 0.001
  weight_decay: 0.0
  scheduler_step_size: 10
  scheduler_gamma: 0.1
  maximum_gradient_norm: null
  gradient_accumulation_steps: 1
  use_mixed_precision: true
  device: auto
  output_root: artifacts/ego_xreal_joint_9class/runs
